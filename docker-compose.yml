# Uso rápido (SQLite em volume persistente):
#   cp .env.example .env     # e defina ADMIN_API_KEY (openssl rand -hex 32)
#   docker compose up -d
#
# Com um Postgres local (opcional), útil para testar o modo "produção":
#   1) no .env:  DATABASE_URL=postgresql://hookrelay:hookrelay@db:5432/hookrelay
#   2) docker compose --profile postgres up -d
services:
  hookrelay:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - hookrelay-data:/app/data

  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: hookrelay
      POSTGRES_PASSWORD: hookrelay
      POSTGRES_DB: hookrelay
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  hookrelay-data:
  pg-data:
