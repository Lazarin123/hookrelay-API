# Blueprint do Render: https://render.com/docs/blueprint-spec
# IMPORTANTE: o disco do plano gratuito é efêmero. Use um Postgres externo (veja docs/DATABASES.md)
# e cole a URL em DATABASE_URL no painel do Render quando ele pedir.
services:
  - type: web
    name: hookrelay
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: TRUST_PROXY
        value: "true"
